[workspace]
members = ["mko-core", "mko-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"

[workspace.dependencies]
clap = { version = "=4.6.2", features = ["derive"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
serde-saphyr = "=0.0.29"
sha2 = "=0.11.0"
hex = "=0.4.3"
chrono = { version = "=0.4.45", features = ["serde"] }
chrono-tz = "=0.10.4"
unicode-normalization = "=0.1.25"
regex = "=1.13.1"
pdf-extract = "=0.12.0"
tempfile = "=3.27.0"
thiserror = "=2.0.18"
sysinfo = "=0.39.6"
hostname = "=0.4.2"
assert_cmd = "=2.1.1"
predicates = "=3.1.3"
