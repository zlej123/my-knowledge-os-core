name: ci
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.97.0
          components: rustfmt, clippy
      - run: ./scripts/fmt.sh --check
        if: runner.os != 'Windows'
      - run: cargo fmt --all -- --check
        working-directory: rust
        if: runner.os == 'Windows'
      - run: cargo clippy --workspace --all-targets -- -D warnings
        working-directory: rust
      - run: cargo test --workspace
        working-directory: rust
      - run: cargo test -p mko-cli --test adapter_policy --test my_knowledge_os_skill
        working-directory: rust
      - name: Check source installer plan (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pwsh -File scripts/install.ps1 -PlanOnly -RepoRoot .
      - name: Check source installer plan (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: ./scripts/install.sh --plan --repo .
